    inp.addEventListener('input', function (e) { if (!composing && !e.isComposing) { var c = cleanNote(inp.value); if (graphemes(inp.value.trim()).length > 10) { inp.value = c; } st.note = c; } });
    function begin() { st.note = cleanNote(inp.value); beat1(); }
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !composing && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); begin(); } });
    a.appendChild(inp); a.appendChild(el('small', null, T('q.hint')));
    var row = el('div', 'row');
    row.appendChild(btn('q.skip', null, 'q.skip', function () { st.note = ''; beat1(); }));
    row.appendChild(btn('q.go', null, 'q.go', begin));
    a.appendChild(row); root.appendChild(a);
    if (!auto.on && inp.isConnected) { inp.focus({ preventScroll: true }); }
  }
  function endView() {
    root.appendChild(topBar(T('top')));
    var t = el('div', 'title'), pth = st.path;
    t.appendChild(el('p', 'tag', T('end.h')));
    var ul = el('ul', 'recap'), lines = [];
    lines.push(pth.morning === 'trash' ? 'rc.trash' : 'rc.walk');
    lines.push(pth.meal === 'name' ? 'rc.name' : 'rc.head');
    lines.push(pth.draw && pth.draw !== 'rest' ? 'rc.' + pth.draw : 'rc.rest');
    lines.push(pth.greet ? 'rc.greet' : 'rc.down');
    lines.push(pth.visit === 'seat' ? 'rc.seat' : 'rc.swing');
    lines.push(pth.omen === 'guard' ? 'rc.guard' : 'rc.robbed');
    lines.forEach(function (k, i) { var li = addText(ul, 'li', null, function (lc) { return Tl(lc, k); }); if (!still()) { li.style.animation = 'hsdBack 1.2s ease ' + (i * .7) + 's both'; } });
    t.appendChild(ul);
    if (st.note) { t.appendChild(el('p', 'quote', T('end.note'))); }
    var nv = el('div', 'nextv'); nv.appendChild(el('p', 'nvl', T('nv.label')));
    addText(nv, 'p', 'nvt', function (lc) { return Tl(lc, pth.visit === 'seat' ? 'nv.seat' : 'nv.swing'); }); t.appendChild(nv);
    t.appendChild(el('p', 'rules', T('end.rules')));
    t.appendChild(el('p', 'tagk', T('end.day'))); t.appendChild(el('p', 'tagk', T('end.other')));
    var h = el('h1', null, 'Homeless Survivor'); h.style.marginTop = '18px'; t.appendChild(h); t.appendChild(el('div', 'ko', '홈리스 서바이버'));
    t.appendChild(el('p', 'by', T('end.credit')));
    var row = el('div', 'row');
    row.appendChild(btn('e.watch', null, 'end.watch', startAuto));
    row.appendChild(btn('e.replay', 'pri', 'end.replay', function () { stopAuto(false); reset(); mode = 'ask'; paintAll(); }));
    t.appendChild(row); root.appendChild(t);
    root.setAttribute('data-done', '1');
  }

  /* ===== 9. the beats (each choice changes numbers once; re-painting never re-applies effects) ===== */
  function base(scene, when, day, paras) { view = { scene: scene, when: when, day: day, paras: paras, traces: null, why: '', card: null, choices: [] }; }
  function result(paras, deltas, special, next, quiet) {
    /* recording mode keeps only the result on screen, like a subtitle, so the frame never scrolls */
    view.paras = view.paras.filter(function (p) { return p.c !== 'inner' && !(rec && auto.on); }).concat(paras.map(function (p) { return { k: p.k, c: p.c || 'result' }; }));
    view.traces = { keys: traceKeys(deltas, special), deltas: deltas };
    view.why = ''; view.choices = [{ id: 'next', k: 'ui.next', cont: true, act: next }];
    show();
    var ho = deltas.filter(function (x) { return x.k === 'ho'; })[0];
    if (ho && ho.d >= LD.bloomAt && !quiet) { fx('bloom'); }
  }
  function beat1() {
    st.tn = 0; root.removeAttribute('data-done');
    base({ kind: 'park', time: 'dawn', p01: 'pass1', snow: 0 }, 'w.1', 1, [{ k: 's1' }, { k: 's1.p' }, { k: 's1.in', c: 'inner' }]);
    view.choices = tunnel([
      { id: 's1.c1', k: 's1.c1', tier: 1, act: function () { st.path.morning = 'trash'; result([{ k: 's1.r1' }], change(LD.trash), null, beat2); } },
      { id: 's1.c2', k: 's1.c2', tier: 2, act: function () { st.path.morning = 'walk'; result([{ k: 's1.r2' }], change(LD.walk), null, beat2); } },
      { id: 's1.c3', k: 's1.c3', tier: 3, mem: 'hello' },
      { id: 's1.c4', k: 's1.c4', tier: 5, mem: 'draw' }
    ], LD.tutorialForce);
    mode = 'play'; show();
  }
  function beat2() {
    base({ kind: 'kitchen', pose: 'queue' }, 'w.2', 1, [{ k: 's2' }]);
    view.choices = tunnel([
      { id: 's2.c1', k: 's2.c1', tier: 3, act: function () { st.path.meal = 'name'; var d = merge(change(LD.meal), change(LD.name)); result([{ k: 's2.r1' }], d, 'tr.name', beat3, true); fx('push'); fx('ladle'); } },
      { id: 's2.c2', k: 's2.c2', tier: 1, act: function () { st.path.meal = 'head'; var d = merge(change(LD.meal), change(LD.head)); result([{ k: 's2.r2' }], d, null, beat3); fx('ladle'); } }
    ]);
    show();
  }
  function beat3() {
    base({ kind: 'kitchen', pose: 'seat' }, 'w.2', 1, [{ k: 's3' }]);
    view.choices = tunnel([
      { id: 's3.c1', k: 's3.c1', tier: 5, mem: 'draw', act: drawPick },
      { id: 's3.c2', k: 's3.c2', tier: 1, act: function () { st.path.draw = 'rest'; result([{ k: 's3.r2' }], change(LD.rest), null, beat4); } }
    ]);
    show();
  }
  function drawPick() {
    view.paras = [{ k: 's3.q' }]; view.traces = null;
    view.choices = tunnel(['d1', 'd2', 'd3'].map(function (d) {
      return { id: 's3.' + d, k: 's3.' + d, tier: 5, act: function () {
        st.path.draw = d; view.card = { d: d, live: true };
        result([{ k: ['s3.r1', 's3.r1.' + d] }, { k: 's3.fold' }], change(LD.draw), null, beat4);
      } };
    }));
    show();
  }
  function beat4() {
    var drew = st.path.draw && st.path.draw !== 'rest';
    base({ kind: 'park', time: 'noon', p01: 'near', snow: 1, paper: drew }, 'w.3', 1, [{ k: 's4' }]);
    view.choices = tunnel([
      { id: 's4.c1', k: 's4.c1', tier: 3, act: function () {
        st.path.greet = true; st.faces.push('P01'); view.scene = { kind: 'park', time: 'noon', p01: 'turn', snow: 1, paper: drew, fresh: 'P01' };
        result([{ k: 's4.r1' }], change(LD.greet), 'tr.face', beat5a);
      } },
      { id: 's4.c2', k: 's4.c2', tier: 1, act: function () {
        st.path.greet = false; view.scene = { kind: 'park', time: 'noon', p01: 'leave', snow: 1, paper: drew };
        result([{ k: 's4.r2' }], [], null, beat5a);
      } }
    ]);
    show();
  }
  function beat5a() {
    var f = st.path.draw && st.path.draw !== 'rest' ? st.path.draw : null;
    base({ kind: 'house', pose: 'door', feat: f }, 'w.4', 2, [{ k: 's5a' }]);
    view.choices = [{ id: 'next', k: 'ui.next', cont: true, act: beat5b }];
    show();
  }
  function beat5b() {
    var f = view.scene.feat, paras = [{ k: 's5' }];
    if (f) { paras.push({ k: 's5.' + f, c: 'inner' }); }                     /* the player recognises him; the boy does not */
    base({ kind: 'house', pose: 'meet', feat: f }, 'w.4', 2, paras);
    if (f) { view.card = { d: f, live: false, mini: true }; }       /* B06: the remembered detail is compared on the folded drawing */
    view.choices = tunnel([
      { id: 's5.c1', k: 's5.c1', tier: 3, act: function () { st.path.visit = 'swing'; view.scene = { kind: 'house', pose: 'swing', feat: f }; result([{ k: 's5.r1' }], change(LD.swing), 'tr.son', beat5c); } },
      { id: 's5.c2', k: 's5.c2', tier: 3, act: function () { st.path.visit = 'seat'; view.scene = { kind: 'house', pose: 'seat', feat: f }; result([{ k: 's5.r2' }], change(LD.seat), null, beat5c); } }
    ]);
    show();
  }
  function beat5c() {
    var sc = view.scene, card = view.card;
    base(sc, 'w.4', 2, [{ k: 's5.out' }]); view.card = card;
    view.choices = [{ id: 'next', k: 'ui.next', cont: true, act: beat6 }];
    show();
  }
  function beat6() {
    change(LD.nights);
    var drew = st.path.draw && st.path.draw !== 'rest', faced = st.faces.indexOf('P01') >= 0;
    base({ kind: 'park', time: 'omen', p01: faced ? 'guard' : null, snow: 2, paper: drew }, 'w.5', 3, [{ k: 's6' }]);
    view.choices = tunnel([
      { id: 's6.c1', k: 's6.c1', tier: 1, act: function () {
        if (faced) { st.path.omen = 'guard'; result([{ k: 's6.r1' }], change(LD.guard), 'tr.guard', ending); }
        else { st.path.omen = 'robbed'; var lost = Math.ceil(st.money / 2); result([{ k: 's6.r2' }], change({ se: LD.robbed.se, money: -lost }), null, ending); }
      } }
    ]);
    show();
  }
  function ending() {
    mode = 'end'; paintAll(); locked = false;
    if (auto.on) { root.setAttribute('data-auto-ms', String(Math.round(auto.active))); }
  }

  /* ===== 10. one activation path for every input (V2.4 B01, B02) ===== */
  var ACT = new WeakMap();                                          /* button -> action, kept inside this demo only */
  function activate(b, src) {
    if (!b || !b.isConnected) { return false; }
    if (src !== 'auto' && auto.on) { stopAuto(true); }             /* any person's input takes over from the guided play */
    var fn = ACT.get(b); if (fn) { fn(); }
    return true;
  }
  var hintTimer = null;
  function showHint() { if (!view || view.why || !whyBox) { return; } whyBox.textContent = ''; whyBox.classList.add('hint'); addText(whyBox, 'span', null, function (lc) { return Tl(lc, 'ui.hint'); }); }
  function hintable(b) {
    b.addEventListener('focus', showHint);
    b.addEventListener('mouseenter', function () { clearTimeout(hintTimer); hintTimer = setTimeout(showHint, 600); });
    b.addEventListener('mouseleave', function () { clearTimeout(hintTimer); });
    b.addEventListener('pointerdown', function (e) { if (e.pointerType === 'touch') { clearTimeout(hintTimer); hintTimer = setTimeout(showHint, 500); } });
    b.addEventListener('pointerup', function () { clearTimeout(hintTimer); });
    b.addEventListener('pointercancel', function () { clearTimeout(hintTimer); });
  }
  root.addEventListener('keydown', function (e) {
    kbd = true;
    var det = root.querySelector('details.opts');
    if (e.key === 'Escape') {
      if (det && det.open) { det.open = false; var sm = det.querySelector('summary'); if (sm) { sm.focus(); } e.preventDefault(); return; }
      if (auto.on) { stopAuto(true); e.preventDefault(); return; }
    }
    if (e.target && e.target.tagName === 'INPUT') { return; }
    if (det && det.open) { return; }                                /* settings open: story shortcuts are off; closed again: they work */
    if (mode !== 'play' || !choiceBox || !choiceBox.isConnected) { return; }
    var b = null;
    if (/^[1-5]$/.test(e.key)) { b = choiceBox.querySelector('[data-n="' + e.key + '"]'); }
    else if (e.key === 'Enter' && (!e.target || e.target.tagName !== 'BUTTON')) { b = choiceBox.querySelector('[data-n="0"]'); }
    if (b) { e.preventDefault(); b.focus({ preventScroll: true }); activate(b, 'user'); }
  });
  root.addEventListener('pointermove', function () { if (mode === 'end' && root.getAttribute('data-auto') === '1' && !auto.on) { root.removeAttribute('data-auto'); } });
  root.addEventListener('pointerdown', function (e) {
    kbd = false;
    var d = root.querySelector('details.opts[open]'); if (d && !d.contains(e.target)) { d.open = false; }
  });

  /* ===== 11. guided play: about three minutes, the same every time (V2.0 ch.174, V2.4 B09) ===== */
  var auto = { on: false, paused: false, i: 0, acc: 0, active: 0, last: 0, timer: null, pressing: null };
  var SCRIPT = [
    [3800, 't.play'], [5200, 'q.skip'],
    [8000, 's1.c3'], [2600, 's1.c4'], [2600, 's1.c3'], [3000, 's1.c2'], [7000, 'next'],
    [9500, 's2.c1'], [10000, 'next'],
    [6000, 's3.c1'], [5500, 's3.d1'], [9000, 'next'],
    [8000, 's4.c1'], [8500, 'next'],
    [8000, 'next'], [10000, 's5.c1'], [9000, 'next'], [8000, 'next'],
    [7500, 's6.c1'], [10000, 'next']
  ];
  function autoBar() {
    var bar = el('div', 'autobar'); bar.setAttribute('role', 'group'); bar.setAttribute('aria-label', T('ui.auto'));
    var p = el('button', 'pill', T(auto.paused ? 'ui.resume' : 'ui.pause')); p.type = 'button'; p.setAttribute('data-fid', 'auto-pause');
    p.addEventListener('click', function () { auto.paused = !auto.paused; root.setAttribute('data-paused', auto.paused ? '1' : '0'); p.textContent = T(auto.paused ? 'ui.resume' : 'ui.pause'); });
    var t = el('button', 'pill', T('ui.takeover')); t.type = 'button'; t.setAttribute('data-fid', 'auto-take');
    t.addEventListener('click', function () { stopAuto(true); var f = root.querySelector('.choices .ch:not(.dim)'); if (f) { f.focus({ preventScroll: true }); } });
    bar.appendChild(p); bar.appendChild(t); return bar;
  }
  /* stopAuto(true): a person takes over. The current screen and its results stay exactly as they are. */
  function stopAuto(takeOver) {
    if (auto.timer) { clearInterval(auto.timer); auto.timer = null; }
    if (auto.pressing) { auto.pressing.b.classList.remove('press'); auto.pressing = null; }
    auto.on = false; auto.paused = false;
    root.removeAttribute('data-paused');
    if (takeOver || !(mode === 'end' && rec)) { root.removeAttribute('data-auto'); }
    var bar = root.querySelector('.autobar'); if (bar) { bar.remove(); }
  }
  function autoTick() {
    if (!auto.on) { return; }
    var now = performance.now(), dt = Math.min(500, Math.max(0, now - auto.last)); auto.last = now;
    if (auto.paused || document.hidden) { return; }                 /* a hidden tab never jumps several scenes on return */
    auto.active += dt;
    if (auto.pressing) {
      auto.pressing.left -= dt;
      if (auto.pressing.left > 0) { return; }
      var pb = auto.pressing.b; auto.pressing = null; pb.classList.remove('press');
      if (!pb.isConnected) { stopAuto(true); return; }
      auto.i += 1; activate(pb, 'auto');
      if (auto.i >= SCRIPT.length) { stopAuto(false); }
      return;
    }
    var step = SCRIPT[auto.i]; if (!step) { stopAuto(false); return; }
    auto.acc += dt;
    if (auto.acc < step[0]) { return; }
    var b = root.querySelector('[data-id="' + step[1] + '"]');
    if (!b) { if (auto.acc > step[0] + 10000) { stopAuto(true); } return; }   /* the expected button is gone: hand over, keep the screen */
    auto.acc = 0; b.classList.add('press'); auto.pressing = { b: b, left: 600 };
  }
  function startAuto() {
    stopAuto(false); reset(); st.note = '';
    auto.on = true; auto.paused = false; auto.i = 0; auto.acc = 0; auto.active = 0; auto.last = performance.now(); root.setAttribute('data-auto', '1');
    mode = 'title'; paintAll();
    auto.timer = setInterval(autoTick, 100);
  }

  /* ===== 12. settings that change at runtime ===== */
  onMq(mqReduce, function () { paintAll(); });
  onMq(mqNarrow, function () { if (mode === 'play' && stage) { paintScene(true); } });

  reset();
  if (rec) { startAuto(); } else { paintAll(); }
  document.addEventListener('visibilitychange', function () { if (auto.on) { auto.last = performance.now(); } });
})();
</script>
