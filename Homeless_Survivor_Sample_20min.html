<style>
/*
  Homeless Survivor

  20-minute sample (days 1-3), built from production plan V3.6. Vanilla HTML/CSS/JS, no external library, no network.
  Paste order inside an existing index.html: this <style> → two JSON language packs → <section id="hss"> → the last <script>.
  Every selector is scoped to .hss, so the host page is not touched.
  Readability (254): background #0b0b0b; text only #f2efe8 and #d6d1c7; body 18px+, small 15px+, weight 400+, line-height 1.6+.
*/
.hss{--hs-bg:#0b0b0b;--hs-text:#f2efe8;--hs-text-2:#d6d1c7;--hs-line:#3a3836;--hs-warm:#e6a35c;--hs-panel:#141414;
  max-width:1080px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:8px 16px 24px;box-sizing:border-box;
  background:var(--hs-bg);color:var(--hs-text);font-family:"Iowan Old Style","Palatino Linotype","Book Antiqua","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  font-size:18px;line-height:1.7;font-weight:400;display:flex;flex-direction:column;gap:12px;position:relative;-webkit-text-size-adjust:100%}
.hss *{box-sizing:border-box}
/* guard against host-page element rules (paste-block use) */
.hss h1,.hss h2,.hss p,.hss ul,.hss ol,.hss li,.hss blockquote,.hss label,.hss span,.hss em,.hss input{color:inherit;font-family:inherit;letter-spacing:normal;text-transform:none;text-shadow:none}
.hss button{text-transform:none;letter-spacing:normal}
.hss[lang="ko"]{word-break:keep-all}
.hss .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hss button{font:inherit;color:inherit}
.hss button:focus-visible,.hss input:focus-visible,.hss [tabindex]:focus-visible{outline:3px solid var(--hs-warm);outline-offset:2px}
/* top bar */
.hss .hs-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;min-height:48px;font:15px/1.6 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--hs-text-2)}
.hss .hs-when{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hss .hs-dots{display:flex;gap:5px}
.hss .hs-dots span{width:9px;height:9px;border-radius:50%;border:1px solid var(--hs-text-2)}
.hss .hs-dots span.past{background:var(--hs-text-2)}
.hss .hs-dots span.now{background:var(--hs-warm);border-color:var(--hs-warm)}
.hss .hs-tools{display:flex;gap:8px;flex-wrap:wrap}
.hss .hs-pill{font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;min-height:48px;padding:8px 16px;border-radius:999px;border:1px solid var(--hs-line);background:none;color:var(--hs-text);cursor:pointer}
.hss .hs-pill[aria-pressed="true"]{border-color:var(--hs-warm);box-shadow:inset 0 0 0 1px var(--hs-warm)}
/* stage */
.hss .hs-stage{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:11/5}
.hss .hs-stage svg{display:block;width:100%;height:100%}
.hss .hs-stage .scene,.hss .hs-stage .hue{transition:filter 2.4s cubic-bezier(.4,0,.2,1)}
.hss .hs-stage .face{opacity:0;transition:opacity 1.6s ease}
.hss .hs-stage .face.on{opacity:1}
.hss .hs-stage .face .halo{opacity:.35}
.hss .hs-stage .face.fresh path{stroke-dasharray:60;stroke-dashoffset:60;animation:hssDraw 1.4s ease forwards}
.hss .hs-stage .face.on .eye{transform-box:fill-box;transform-origin:center;animation:hssBlink 6.5s ease-in-out infinite}
.hss .hs-stage .breath{opacity:0;animation:hssBreath 5.2s ease-in-out infinite;animation-delay:var(--bd,0s)}
.hss .hs-stage .drift{animation:hssDrift var(--dt,40s) linear forwards}
.hss .hs-stage .steam path{animation:hssSteam 3.6s ease-in-out infinite}
.hss .hs-stage .sway{transform-box:fill-box;transform-origin:50% 0;animation:hssSway 3.4s ease-in-out infinite}
.hss .hs-stage .arm2{opacity:0;transition:opacity .6s}
.hss .hs-stage svg.lose .arm1{opacity:0}
.hss .hs-stage svg.lose .arm2{opacity:1}
.hss .hs-stage .bloom{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,214,160,0) 35%,rgba(255,196,130,.32) 100%)}
.hss .hs-stage .bloom.go{animation:hssBloom 2.6s ease-out 1}
@keyframes hssSteam{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-6px);opacity:.25}}
@keyframes hssFall{from{transform:translateY(-20px)}to{transform:translateY(520px)}}
@keyframes hssRain{from{transform:translate(0,-30px)}to{transform:translate(-120px,520px)}}
@keyframes hssDraw{to{stroke-dashoffset:0}}
@keyframes hssBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.15)}}
@keyframes hssBreath{0%,55%,100%{opacity:0;transform:translate(0,0)}70%{opacity:.22}90%{opacity:0;transform:translate(3px,-4px)}}
@keyframes hssDrift{to{transform:translateX(var(--dx,0px))}}
@keyframes hssSway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes hssBloom{0%{opacity:0;transform:scale(1.25)}35%{opacity:1}100%{opacity:0;transform:scale(1)}}
@keyframes hssFade{from{opacity:0}to{opacity:1}}
@keyframes hssBack{from{filter:blur(.8px)}to{filter:blur(0)}}
@keyframes hssLose{from{filter:blur(0)}to{filter:blur(.8px)}}
/* the drawing on the back of a flyer */
.hss .card{position:absolute;right:4%;bottom:7%;width:min(28%,200px);aspect-ratio:4/5;background:#efe8da;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.6);transform:rotate(-3deg);opacity:0;transition:opacity .9s;z-index:2}
.hss .card.on{opacity:1}
.hss .card.mini{width:min(15%,120px);left:3%;right:auto;bottom:auto;top:6%}
.hss .card.inbag{position:relative;right:auto;bottom:auto;display:block;width:150px;margin:8px auto}
.hss .card svg{width:100%;height:100%}
.hss .card path{stroke:#2a2622;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hss .card.on.live path{stroke-dasharray:400;stroke-dashoffset:400;animation:hssDraw 1.5s ease forwards}
.hss .card.on.live path.late{animation-delay:1.1s}
/* status: four bars with state words; numbers only when asked */
.hss .hs-status{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:14px;align-items:end;font:15px/1.6 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--hs-text-2)}
.hss .hs-bar .lab{display:flex;gap:6px;flex-wrap:wrap}
.hss .hs-bar em{font-style:normal;color:var(--hs-text)}
.hss .hs-bar i{display:block;height:5px;background:#2b2a28;margin-top:4px;border-radius:3px;overflow:hidden}
.hss .hs-bar b{display:block;height:100%;background:var(--hs-text-2);transition:width 1.2s ease}
.hss .hs-coins{white-space:nowrap;color:var(--hs-text)}
/* text area: the fixed place of Continue is its bottom right (260.3) */
.hss .hs-textbox{position:relative;display:flex;flex-direction:column;gap:12px;padding-bottom:4px}
.hss .hs-slug{margin:0;font:15px/1.6 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--hs-text-2);letter-spacing:.02em}
.hss .hs-text{font-size:clamp(18px,2.1vw,21px);line-height:1.8;max-width:68ch}
.hss .hs-text p{margin:0 0 .6em}
.hss .hs-text .inner{font-style:italic;color:var(--hs-text-2)}
.hss .hs-text .hint{font:16px/1.6 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--hs-text-2);border-left:2px solid var(--hs-warm);padding-left:10px}
.hss .hs-text .luck{color:var(--hs-text-2)}
.hss .hs-trace{list-style:none;margin:0;padding:0 0 0 12px;border-left:2px solid var(--hs-line);font:15px/1.6 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--hs-text-2)}
.hss .hs-trace .num{color:var(--hs-text)}
.hss .hs-why{margin:0;min-height:1.6em;font-size:16px;font-style:italic;color:var(--hs-text-2)}
.hss .hs-why.hint{font-style:normal}
.hss .hs-why:empty{min-height:0}
.hss .hs-choices,.hss .hs-utilrow,.hss .hs-dest{display:grid;gap:8px}
.hss .hs-ch{display:flex;gap:10px;align-items:baseline;text-align:left;font:17px/1.6 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--hs-text);background:var(--hs-panel);border:1px solid var(--hs-line);border-radius:10px;padding:12px 14px;min-height:52px;cursor:pointer;width:100%}
.hss .hs-ch:hover{border-color:#6b6762}
.hss .hs-ch .k{flex:0 0 auto;min-width:18px;color:var(--hs-text);font-weight:700}
.hss .hs-ch .t{flex:1}
.hss .hs-ch .sub{display:block;font-size:15px;color:var(--hs-text-2)}
.hss .hs-ch.util{background:none;border-style:dashed}
.hss .hs-ch.press{border-color:var(--hs-warm)}
.hss .hs-ch.off{cursor:default}
/* a thought out of reach: still readable (254.5): blur at most .8px, a dotted marker, the screen reader hears it */
.hss .hs-ch.dim{cursor:default;border-style:dotted;background:none}
.hss .hs-ch.dim .t{color:var(--hs-text-2);filter:blur(.8px);text-decoration:underline dotted;text-underline-offset:5px}
.hss .hs-ch.losing .t{animation:hssLose .3s ease forwards}
.hss .hs-ch.back .t{animation:hssBack 1.2s ease forwards}
.hss .hs-nextrow{display:flex;justify-content:flex-end;gap:10px;align-items:center;flex-wrap:wrap;margin-top:2px}
.hss .hs-nextrow.center{justify-content:center}
.hss .hs-next{min-height:52px;min-width:150px;padding:10px 22px;border-radius:999px;border:1px solid var(--hs-text);background:var(--hs-text);color:var(--hs-bg);font:17px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;cursor:pointer}
.hss .hs-skip{min-height:48px;padding:8px 14px;border-radius:999px;border:1px solid var(--hs-line);background:none;font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;cursor:pointer;margin-right:auto}
/* buttons */
.hss .hs-btn{min-height:52px;padding:10px 20px;border-radius:999px;border:1px solid var(--hs-line);background:none;color:var(--hs-text);font:17px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;cursor:pointer}
.hss .hs-btn.pri{background:var(--hs-text);color:var(--hs-bg);border-color:var(--hs-text)}
.hss .hs-btn.big{min-height:64px;min-width:280px;font-size:1.25rem}
.hss .hs-btn.eq{min-height:56px;min-width:160px;font-size:1.125rem}
.hss .hs-link{background:none;border:0;border-bottom:1px solid var(--hs-text-2);padding:4px 2px;min-height:44px;font:16px/1.6 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;cursor:pointer}
/* full screens */
.hss .hs-full{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px 4px}
.hss .hs-full h1{font-weight:400;font-size:clamp(34px,6vw,60px);letter-spacing:.03em;margin:0;line-height:1.25}
.hss .hs-full .form,.hss .hs-full .by,.hss .hs-full .sample,.hss .hs-full .dep,.hss .hs-full .copy,.hss .hs-full .note{font:15px/1.6 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--hs-text-2);margin:0;max-width:60ch}
.hss .hs-full .tag{font-size:clamp(18px,2.2vw,22px);max-width:44ch;margin:6px 0 0}
.hss .hs-titleacts{display:flex;flex-direction:column;gap:12px;align-items:center;margin:14px 0 4px}
.hss .hs-epi blockquote{margin:0;max-width:30ch;font-size:28px;line-height:1.6;font-style:italic}
.hss .hs-epi blockquote.fade{animation:hssFade 1.2s ease both}
.hss .hs-ask .q{font-size:clamp(20px,2.6vw,25px);line-height:1.7;max-width:36ch}
.hss .hs-ask input{font:22px/1.4 "Iowan Old Style","Palatino Linotype","Noto Serif KR",Georgia,serif;background:transparent;border:0;border-bottom:1px solid var(--hs-text-2);color:var(--hs-text);text-align:center;padding:8px 4px;width:min(340px,90%);border-radius:0}
.hss .hs-ask .hint{font:15px/1.6 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--hs-text-2);margin:0;max-width:50ch}
.hss .hs-askrow{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.hss .hs-ask hr{width:min(560px,90%);border:0;border-top:1px solid var(--hs-line);margin:24px 0 0}
.hss .hs-ask .made{font:15px/1.6 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--hs-text-2);max-width:560px;margin:8px 0 0;text-align:left}
.hss .hs-letter h2{font-weight:400;margin:0}
.hss .hs-letter .letter{font:24px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;margin:0}
.hss .hs-radios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(460px,100%)}
.hss .hs-radios label{display:flex;gap:8px;align-items:center;min-height:48px;padding:6px 12px;border:1px solid var(--hs-line);border-radius:10px;font:16px/1.4 ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
.hss .hs-decl .top{font:15px/1.6 system-ui,sans-serif;letter-spacing:.16em;color:var(--hs-warm);margin:0}
.hss .hs-decl .body{max-width:44ch;font-size:clamp(19px,2.4vw,23px);margin:0}
.hss .hs-cred .c{font-size:clamp(20px,2.6vw,26px);margin:0;transition:opacity 1s}
.hss .hs-cred .c.small{font-size:16px;color:var(--hs-text-2)}
.hss .hs-cred .c.wait{opacity:0}
.hss .hs-tc{cursor:pointer;min-height:60vh}
.hss .hs-tc:focus{outline:none}
.hss .hs-endcard h1{font-size:clamp(28px,4vw,40px)}
.hss .hs-endcard .line,.hss .hs-endcard .quote{max-width:48ch;margin:0}
.hss .hs-endcard .quote{font-style:italic}
.hss .hs-endcard .other,.hss .hs-endcard .rules{font:16px/1.6 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--hs-text-2);max-width:52ch;margin:0}
.hss .hs-endcard .c{margin:0}
.hss .hs-endcard .c.small{font:15px/1.6 system-ui,sans-serif;color:var(--hs-text-2)}
.hss .recap{list-style:none;padding:0;margin:4px 0;display:grid;gap:4px;max-width:54ch}
.hss .recap li{font-size:17px;line-height:1.6}
/* windows */
.hss .hs-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.hss .hs-dialog{background:#121212;border:1px solid var(--hs-line);border-radius:14px;max-width:640px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left}
.hss .hs-dialog h2{margin:0;font-weight:400;font-size:22px}
.hss .hs-dbody{display:flex;flex-direction:column;gap:10px}
.hss .hs-dbody p{margin:0}
.hss .hs-drow{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.hss .hs-drow.two{justify-content:space-between}
.hss .hs-mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hss .hs-small{font:15px/1.6 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--hs-text-2);margin:0}
.hss .hs-orow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hss .hs-orow .ogrp{display:flex;gap:6px;flex-wrap:wrap}
.hss .hs-list{margin:0;padding-left:20px;display:grid;gap:4px}
.hss .hs-log{margin:0;padding-left:0;list-style:none;display:grid;gap:12px}
.hss .hs-log li{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--hs-line);padding-left:10px}
.hss .hs-log .when{font:15px/1.6 system-ui,sans-serif;color:var(--hs-text-2)}
.hss .hs-log .line{font-size:16px;line-height:1.6}
.hss .hs-map{width:100%;height:auto;background:#0f0f0f;border-radius:10px;font-family:system-ui,"Malgun Gothic",sans-serif}
/* narrow screens: 390 / 320 */
@media (max-width:640px){
  .hss{padding:6px 16px 20px}
  .hss .hs-stage{aspect-ratio:4/3}
  .hss .hs-status{grid-template-columns:repeat(2,1fr);gap:8px 14px}
  .hss .hs-coins{grid-column:1/-1}
  .hss .hs-epi blockquote{font-size:21px}
  .hss .hs-btn.big{min-width:80%}
  .hss .card{width:38%}
  .hss .hs-mgrid,.hss .hs-radios{grid-template-columns:1fr}
}
@media (max-width:360px){
  .hss .hs-askrow{flex-direction:column;width:100%}
  .hss .hs-askrow .hs-btn{width:100%}
  .hss .hs-next{min-width:0;width:100%}
}
/* motion off (OS setting or Options): decoration stops; the meaning stays in text and the dotted marker */
.hss[data-still="1"] .hs-stage .scene,.hss[data-still="1"] .hs-stage .hue,.hss[data-still="1"] .card,.hss[data-still="1"] .hs-bar b,.hss[data-still="1"] .hs-stage .face{transition:none}
.hss[data-still="1"] .breath,.hss[data-still="1"] .drift,.hss[data-still="1"] .sway,.hss[data-still="1"] .steam path,.hss[data-still="1"] .eye,.hss[data-still="1"] .bloom,.hss[data-still="1"] .face.fresh path,.hss[data-still="1"] .hs-ch .t{animation:none !important}
.hss[data-still="1"] .hs-ch.dim .t{filter:none;font-style:italic}
.hss[data-still="1"] .arm2{transition:none}

 far · Esc menu","ui.saved":"Saved on this device","bar.hun":"Fullness","bar.hp":"Health","bar.se":"Self-esteem","bar.ho":"Hope","st.hun.0":"Full","st.hun.1":"Fine","st.hun.2":"Hungry","st.hun.3":"Starving","st.hun.4":"Exhausted","st.hp.0":"Healthy","st.hp.1":"Holding up","st.hp.2":"Hurting","st.hp.3":"In danger","st.hp.4":"Critical","st.se.0":"Steady","st.se.1":"Fine","st.se.2":"Shaken","st.se.3":"Crumbling","st.se.4":"Panic","st.ho.0":"Light","st.ho.1":"Warmth","st.ho.2":"Faint","st.ho.3":"Ashen","st.ho.4":"Dark","epi":"The more abundance fills everything, the more clearly we come face to face with the loneliness and lack within us.","q.ask":"Before you begin Homeless Survivor, is there something you want to say to the child you love?","q.label":"Words for your child","q.hint":"Up to 10 characters. It stays only on this device, and you can erase it in Options.","q.skip":"Skip","q.go":"Begin","q.made":"Homeless Survivor was designed with many kinds of users and devices in mind, and it runs with a single click. The program is a single HTML file that needs no installation, and its graphics are built with SVG (Scalable Vector Graphics), a web standard. SVG is an XML-based technology for two-dimensional vector graphics. It stays sharp at any resolution while remaining small in size.","lt.ask":"Would you like to send a letter to your child?","lt.yes":"Send a letter","lt.no":"Not now","lt.h":"A sound letter","lt.body":"The letter becomes a short melody from this device's speaker. A phone held nearby could hear it. Nothing is sent over any network, and nothing is recorded.","lt.yours":"Your letter","lt.pick":"Sound letters carry only English capital letters. Choose one:","lt.send":"Play the letter","lt.playing":"The melody is playing…","lt.sent":"The letter has been sent into the air.","lt.nosound":"This browser cannot play sound here. The letter stays in the notebook instead.","decl.top":"2D TEXT INTERACTIVE CINEMA","decl.body":"This work uses SVG silhouettes, carefully restrained text, and the rules of the system itself — its stats and the tunnelling of choices — as the tools of cinema.","cred.1":"Morgan J. presents","cred.2":"A film by Morgan J.","cred.3":"Written and directed by Morgan J.","cred.4":"© 2026 Morgan J. All rights reserved.","op.1":"There was a small apartment with a window that faced the morning. {hero} drove a forklift at a warehouse. His wife sang while she cooked.","op.2":"Then she became ill. The songs stopped before the winter ended. {son} was too young to remember her voice.","op.3":"One night, after a long shift, there was rain, and a car that did not stop. {hero} woke up in a hospital without his lower leg.","op.4":"The bills came faster than the healing. He lost the job. Then the apartment.","op.5":"He took {son}, who was three, to a place called Sunshine House. He promised to come back when things were better.","op.6":"Things did not get better. For years he moved between small rooms and short jobs. This winter, he has nowhere left but a bench in the park.","op.6b":"On the bench, he takes out the photograph. The corner has gone soft under his thumb.","draw.btn":"Draw his son's face.","op.6b.r":"A few pencil lines on the back of a flyer. A small face, almost a smile.","op.7":"His son's birthday is later this week.","op.skip":"Skip the story","tc.note":"Your first journey is played on Normal. Hard and Extreme open after you reach an ending on the thirtieth day.","pl.L1":"The park bench","pl.L2":"The meal center","pl.L3":"The public restroom","pl.L4":"The underpass","pl.L5":"Sunshine House","pl.L6":"The hospital","pl.L7":"The square","pl.L8":"The corner store","pl.L9":"The shelter","pl.L10":"The scrapyard","loc.L1":"Frost on the slats where no one sat. The lamp hums above the path.","loc.L1.n":"The lamps are on. The bench looks wider than it does by day.","loc.L2":"Red brick, a steamed window, a line that starts before the door opens.","loc.L2.c":"The door is shut. A paper sign: lunch from half past eleven.","loc.L3":"A tiled room that smells of bleach. The tap runs cold, then colder.","loc.L4":"Fluorescent tubes, cardboard laid edge to edge, the low hum of traffic overhead.","loc.L5":"A low gate, a yard with two swings, a bell beside the door.","loc.L5.c":"The gate is shut. A sign: visiting in the afternoon and evening, on visiting days.","loc.L5.done":"The swing moves a little in the wind. Today's visit is over.","loc.L6":"A waiting room with numbered tickets and a radiator that ticks.","loc.L7":"Pigeons, a fountain switched off for winter, and a red box for donations.","loc.L8":"Bright aisles behind glass. A bell rings each time the door opens.","loc.L8.c":"The store is lit, but the clerk who lets him stay comes in the evening.","loc.L10":"Wire bales, a scale with a shaking needle, a man in gloves who does not look up.","loc.L10.c":"The gate is chained. The scrapyard buys in the morning, the afternoon and the evening.","hub.lunch":"Lunch is being served at the meal center.","hub.visit":"It is visiting time at Sunshine House.","hub.visit.last":"The last visiting hour of the day.","map.h":"Where to go","map.here":"You are here","map.near":"One step","map.mid":"A walk","map.far":"A long way","map.road":"crosses the big road","map.locked":"Opens on day 5","map.noedge":"Not reachable in one move","map.closed":"closed now","map.costN":"Fullness −{c}","map.note":"A move takes one part of the day.","map.lunch":"Arrive for lunch","map.visit":"Arrive for the visit","mv.1":"A short walk. The cold gets in through the gap at the knee.","mv.2":"The path takes more out of his leg than the distance suggests.","mv.3":"A long way on one good leg. He stops twice to let the ache settle.","mv.road":"At the big road, he waits for the light with everyone else.","mv.rain":"Rain runs down inside his collar.","why.1":"His stomach answers first. That thought will have to wait.","why.2":"The smell of bread pushes the thought away. Once he eats, it may come back.","why.3":"The thought starts toward it, then trips on the hunger. Food first. Then the rest.","why.4":"He can see the thought. He just can't reach it yet.","why.5":"Later. When his hands stop shaking.","why.6":"Not yet.","why.se":"His eyes stay on the ground. That thought needs a straighter back.","c0101.t":"Someone taps the leg of the bench with his shoe. “You can't sleep here, sir. I've told you.” The guard's flashlight passes over {hero}'s face and stops on the prosthetic leg. The light hesitates for a moment.","c0101.a":"Get up.","c0101.a.r":"Below the knee, everything is cold. While he fits the leg, the guard stands with his back turned. Waiting for him, or not wanting to watch; hard to say.","c0101.b":"Lie there a little longer.","c0101.b.r":"“Five minutes.” The guard sighs and walks away. Five minutes is shorter than it sounds.","c0102.t":"On the next bench, an old man folds his newspaper. “First time, isn't it? It shows. You hold your bag too tight.” He laughs with a mouth missing a few teeth.","c0102.a":"Ask where the meal center is.","c0102.a.r":"The old man draws a map in the dirt with a stick. Across the big road, a red brick building. “From half eleven. Come late and there's only soup.” The map opens.","c0102.b":"Say he will find it himself.","c0102.b.r":"“Fair enough. That's a way too.” The old man opens his paper again. One corner of the map opens a little.","c0103.t":"Nothing since lunch yesterday. The hollow in his stomach has grown loud enough to hear, and right then, across the park, someone tears open a bag of bread.","c0103.p":"Polished shoes click past the bench, a briefcase swinging beside them. They don't slow down.","c0103.in":"When you're hungry, your thoughts get narrow.","c0103.still":"The thoughts he was holding drift away, one by one.","c0103.1":"Look in the trash can.","c0103.2":"Walk toward the meal center.","c0103.3":"Say hello to the person eating bread.","c0103.4":"Write today's plan in the notebook.","c0103.1.r":"Under an empty cup, only crumpled newspaper; nothing that could ease the hunger. Only then does he remember the old man's directions to the meal center.","c0103.2.r":"On a cold path every step costs a little more than it should. Crossing the big road the way the old man told him, he feels the cold climb from his toes.","c0103.2.r.u":"On a cold path every step costs a little more than it should. He follows the smell of soup across the big road, and the cold climbs from his toes.","q.front":"He is near the front of the line.","q.mid":"The line already reaches the corner. He takes his place in the middle.","q.back":"By the time he arrives, the line has folded back on itself twice.","c0104.t":"Ladle in hand, the woman behind the counter looks up. “First time here? What's your name?” Someone behind him clears his throat. When did he last say his own name out loud?","c0104.a":"“{hero}.”","c0104.a.r":"“{hero}, it's hot. Be careful.” Steam rises from the bowl. The way she says his name is warmer than the soup.","c0104.b":"Just lower his head.","c0104.b.r":"She doesn't ask again, only adds another ladle of soup. The bowl, held in both hands, finds its way to a corner table.","ret.t":"As the soup goes down, the thoughts he couldn't hold this morning return, one by one. Around then the woman turns a flyer over and slides it across with a pen.","ret.rest":"Say thank you and rest a while.","ret.rest.r":"“Not at all.” She turns away smiling, and for a while there is only the sound of spoons.","draw.q":"The photograph is old. {son} was three then. The pencil waits above the paper.","draw.d1":"Draw the ears, a little big.","draw.d2":"Draw the hair at the crown.","draw.d3":"Draw the dimple on one cheek.","draw.r0":"A face he couldn't picture this morning. A round face.","draw.r.d1":"The ears are a little big. His hand remembers before he does.","draw.r.d2":"A little hair stands up at the crown, just as it does in the photo.","draw.r.d3":"One cheek has a small dimple. The pencil lingers there a moment.","draw.fold":"He folds the paper twice and puts it in the bag, next to the photo.","p01.t":"For the third time today the same shoes click past the bench, and this time the rhythm slows.","p01.t7":"Across the square, the same shoes click past for the third time today, and this time the rhythm slows.","p01.a":"“Hello.”","p01.b":"Look down at the ground.","p01.ok":"The footsteps stop. “Hello,” says a voice above him. He looks up, and for the first time there is a face.","p01.no":"The footsteps don't stop; they fade. Where a face should be, there is only shadow.","c0105.t":"The streetlights come on one by one. The bench looks wider than it did by day, and the wind is sharper. From the underpass comes the sound of someone dragging a box.","c0105.a":"Lie down on the bench.","c0105.a.r":"A few stars. Only as many as he can count.","c0105.b":"Go to the underpass.","c0105.b.r":"Under the fluorescent light, people shift their boxes one sheet each. No one speaks, but a space opens.","night2.t":"The lamps come on. The cold tonight has a different edge, finer, like sand.","night.note":"Before sleep, he opens the notebook. On the first page: “{note}”","night.note0":"Before sleep, he opens the notebook. The first page is still empty.","night.bed":"A dry piece of cardboard, thick and clean, waits by the wall.","act.lunch":"Stand in the meal line.","act.rest":"Sit for a while and rest.","act.rest.L1":"Lean back on the bench and rest.","act.rest.r":"The ache where the leg meets the knee settles for a while.","act.scrap":"Collect cans and cardboard.","act.scrap.r":"Two cans, a flattened box. His back pays for each one.","act.scrap.r1":"One can, rolled under a bench. The rest of the bins are already picked clean.","act.sell":"Sell what he collected.","act.sell.r":"The scale needle shakes, then settles. A few coins drop into his palm.","act.wash":"Wash his face and hands.","act.wash.r":"Cold water, then the mirror. The man in it holds his gaze a little longer.","act.help":"Help wipe the tables.","act.help.r":"The woman hands him a cloth. “I'm Carter. Everyone here says Ms. Carter. Thank you.” The tables shine in long wet stripes.","act.help.r2":"{N01} nods at the cloth in his hand and moves the chairs out of his way.","act.warm":"Warm up in the waiting room.","act.warm.r":"The radiator ticks. Someone's number is called, then the next one.","act.beg":"Hold out a hand.","act.beg.r":"Shoes pass. Some slow, most don't. A few coins, and a long time looking at the ground.","act.beg.known":"A coin lands in his open hand. He looks up: the face that greeted him. The man nods once and walks on without a word.","act.beg.insult":"“Get a job.” The voice is gone before he can look up.","act.bread":"Buy a bread roll.","act.bread.r":"The wrapper crackles. He eats half standing by the door, then the other half.","act.clean":"Help the cleaner pick up the litter.","act.clean.ok":"The cleaner holds the bag open for him. When it is full, she looks at him properly: a face, lined and awake.","act.clean.no":"The cleaner takes the bag without a word and moves on to the next bin.","act.bell":"Ring the bell at Sunshine House.","bag.eat":"Eat the bread from the napkin.","bag.eat.r":"Cold now, a little flattened. It tastes of the pocket and of lunch.","x0201.t":"A woman in a green vest kneels beside the bench. “I'm from the Morning Path Center. We help people find a place to stay and work.” She hands {hero} a card. Then she adds, more quietly, “The director of Sunshine House asked me to give you this.” It is a letter. A family has asked to adopt {son}. The director wants to know what his father thinks.","x0201.t4":"At the mouth of the underpass, a woman in a green vest kneels beside his cardboard. “I'm from the Morning Path Center. We help people find a place to stay and work.” She hands {hero} a card. Then she adds, more quietly, “The director of Sunshine House asked me to give you this.” It is a letter. A family has asked to adopt {son}. The director wants to know what his father thinks.","x0201.a":"Go to Sunshine House today.","x0201.b":"For his sake, go with the center alone.","x0201.c":"Sign the consent.","x0201.a.r":"“Visiting is in the afternoon and the evening.” She writes it on the back of the card. “There's a sink by the door. They let you wash first.”","x0201.bd":"Five days until his son's birthday.","cf.end":"This choice ends this story here, on the second day. It is one way of loving him, and the story will not judge it.","cf.think":"Think again","cf.b":"Go with the center","cf.c":"Sign","e0a.1":"The center's van smells of coffee and wet coats. Nobody asks him to talk.","e0a.2":"In the first month, he sleeps in a shared room and learns to wake without fear.","e0a.3":"In the third month, he drives a forklift again, slowly, on a new leg.","e0a.4":"Every Sunday he walks past Sunshine House. He does not go in. Through the window, a boy is drawing.","e0a.5":"He writes letters that he does not send. The first line is always the same: “{note}”","e0a.5n":"He writes letters that he does not send.","e0a.h":"Early ending — The Quiet Promise","e0a.l":"He is safe. He is working. And a window is still between them.","e0b.1":"He signs his name slowly, so that it looks like his own.","e0b.2":"The center helps him find a room, then a job, then a reason to keep the room.","e0b.3":"In spring, the director sends a photo. {son} is standing between two people, holding a dinosaur.","e0b.4":"On the back, in a child's handwriting: “This is my new house.”","e0b.5":"{hero} puts the photo above his small table. Every morning, he says the words he once wanted to say: “{note}”","e0b.5n":"{hero} puts the photo above his small table.","e0b.h":"Early ending — A New Home","e0b.l":"He kept his promise in another way.","e0.other":"The other road, the one that goes to Sunshine House today, is still there in a new story.","c0202.who.k":"{N01} sees him in the line and lifts the ladle a little.","c0202.who.u":"The woman at the counter sees him in the line and lifts the ladle a little.","c0202.say.n":"“{hero}. You came back.”","c0202.say.u":"“You came back.”","c0202.t2":"Her eyes rest for a moment on the Morning Path card sticking out of his pocket.","c0202.a":"Ask the way to Sunshine House.","c0202.a.r":"She draws on a napkin: the way past the hospital is long, the way past the square is shorter. “Use the sink first. Children notice hands.”","c0202.b":"Save a bread roll for later.","c0202.b.r":"He wraps the roll in a napkin and puts it in his pocket. For a while the pocket is warm.","m01.ent":"“You can wash your hands here.” At the sink the director points to, he folds his coat over one arm, and his eyes go first to a small pair of shoes by the inner door.","m01.wash":"The water is warm. He scrubs the grey from the lines of his knuckles.","m01.dir":"By the door, the director speaks quietly. “The family can wait. Nothing will be decided without you.”","m01.meet":"“He knew your mom and dad,” the director says, but {son} stays close to her side. “Who are you, Mister?” His hand comes down before it reaches the boy's hair.","m01.det.d1":"The ears are a little big. They have not changed.","m01.det.d2":"At the crown, a little hair still stands up.","m01.det.d3":"When he speaks, a dimple appears on one cheek.","m01.det.0":"He looks for the face from the photograph and finds it slowly, one part at a time.","m01.a":"Ask about the swing.","m01.b":"Let him choose a seat.","m01.a.r":"“Which swing do you like?” A small finger finds one through the window without hesitating. “The blue one. The other one makes a noise.” While the boy looks out, he stands beside him, saying nothing.","m01.b.r":"{son} pulls a chair a little away from the door. “You can sit there.” When he sits, the boy, who has been standing, drags the other chair over.","m01.out":"At the door, {son} turns back. “I saw a little dinosaur on a key ring.” He shows its size with two fingers. The director waits until he finishes speaking.","m01.snack":"On the way out, the director puts a packet of crackers in his hand. “For the road.”","m01.miss":"Across the city, the lights in the windows of Sunshine House go out one by one.","mina.t":"Behind the counter, a young clerk is checking dates on the rice balls. She sets three aside, then looks at him. “These expire at midnight. I'd throw them out anyway.”","mina.a":"Take them and say thanks.","mina.b":"Take one and leave the rest.","mina.a.r":"“I'm Mia,” she adds, as if it were a line on the receipt.","mina.b.r":"She raises an eyebrow, then puts the other two under the counter. “They'll be here tomorrow too.”","d3.slug":"Day 3 · Rain","d3.t1":"Rain before light. It finds the gap between the bench slats and the gap in his collar.","d3.t4":"Rain before light. At the mouth of the underpass it falls in a straight grey curtain.","d3.a":"Wait out the rain in the underpass.","d3.a.s":"Dry. Late for the meal line.","d3.b":"Line up early at the meal center.","d3.b.s":"Wet. Near the front of the line.","d3.m.a":"He waits under the fluorescent tubes until the rain thins. By the time he reaches the meal center, the line is long.","d3.m.b":"He stands in the rain with the first ten. When the door opens, steam rises from every coat.","lunch.front":"A full bowl, still too hot to hold.","lunch.mid":"A full bowl. The bread runs out two people behind him.","lunch.back":"Only soup is left by the time he reaches the counter.","d3.p01":"Under an umbrella, the man with the briefcase nods once as he passes. The face is still there.","d3.hosp":"In the afternoon, the rain pushes him into the hospital waiting room. A nurse calls the number on his ticket.","s01.t":"{N05} places a form beside the examination bed. “This is for an assessment. It does not promise a new leg today.” {hero} checks the first line before taking the pen.","s01.a":"Ask about the documents.","s01.a.r":"“Bring the confirmation from the kitchen first.” She writes down the hospital hours. {hero} puts the notice where it will stay dry.","s01.b":"Keep the notice for later.","s01.b.r":"He folds the notice into the dry pocket, next to the card from the center.","d3.night":"The underpass hums all night. Near morning he dreams of the forklift: the forks rising, the pallet steady, his hands knowing where everything is.","omen":"The sky is one shade heavier. Near the square, strangers are lingering.","lk.pick":"Someone brushes past him near the square. By the meal center, he notices the coin pocket is lighter.","lk.pick.g":"“Watch your bag,” says a voice he knows, without stopping. He pulls the strap tight. A moment later, someone brushes past him and finds nothing.","lk.fall":"The wet stairs take the crutch out from under him. The palm of his hand pays for it.","lk.fall.g":"On the wet stairs, a hand he knows catches his elbow before the crutch slips.","lk.short":"The soup is thinner today. The ladle scrapes the bottom of the pot.","lk.short.g":"The soup is thinner today, but the ladle goes back into the pot once more for him.","lk.crack":"Two officers clear the benches. Everyone moves at once, and no one asks where to.","lk.crack.g":"Two officers clear the benches. The cleaner says something to one of them, and they let him gather his things slowly.","lk.coin":"A coin by the curb, face up.","lk.coffee":"Someone from the line hands him a paper cup of coffee and does not wait for thanks.","lk.bread":"The bakery's back door opens; yesterday's bread goes into his hands, not the bin.","lk.none":"The day passes without asking anything of him.","col.t":"The cold reaches the place where thinking happens, and then there is nothing.","col.r":"He wakes under a white ceiling. Someone has taken off his wet shoe. “You collapsed by the road,” a nurse says. “Rest. Then eat something.”","col.r2":"White ceiling again. The same nurse, the same blanket. This time she writes his name on the chart without asking.","col.note":"In the full game, a collapse can end the story. In this sample, he always wakes at the hospital.","bag.photo":"The photograph of {son}, soft at one corner.","bag.draw":"The drawing on the back of a flyer, folded twice.","bag.card":"The Morning Path Center card. Visiting hours on the back.","bag.notice":"The hospital notice, kept dry.","bag.breadI":"A bread roll wrapped in a napkin.","bag.scrap":"Cans and flattened cardboard: {n}","bag.note":"Notebook, first page: “{note}”","bag.note0":"Notebook, first page: empty.","bag.faces":"Faces in the city that have light: {n}","end.h":"That was the first three days of Homeless Survivor.","end.next":"In the full story, day 4 begins under the same sky. {son}'s birthday is in four days.","end.rules":"Hunger narrows the choices. Hope brings the colour back. A stranger who is greeted gets a face.","end.other":"A different choice opens a different day.","end.again":"Play again","end.title":"Back to the title","end.note":"First page of his notebook: “{note}”","rc.c0101.a":"He got up when the light found him.","rc.c0101.b":"He asked for five more minutes.","rc.c0105.a":"On the first night, he slept on the bench under a few stars.","rc.c0105.b":"On the first night, he went to the underpass, and a space opened.","rc.mina":"At the corner store, a clerk set something aside for him.","rc.trash":"Hungry, he looked in the trash can first.","rc.walk":"Hungry, he walked straight to the meal center.","rc.name":"He said his name out loud.","rc.head":"He lowered his head and was given more soup.","rc.d1":"He drew a round face with big ears.","rc.d2":"He drew a round face with hair standing up at the crown.","rc.d3":"He drew a round face with a dimple.","rc.rest":"He rested and listened to the spoons.","rc.greet":"He said hello, and a stranger got a face.","rc.greet.no":"He said hello; the man walked on, still a shadow.","rc.down":"He looked down, and the man stayed a shadow.","rc.miss":"The man with the briefcase passed somewhere he was not.","rc.swing":"He asked {son} about the swing.","rc.seat":"He let {son} choose where to sit.","rc.novisit":"He did not reach Sunshine House on the day of the letter.","rc.d3.a":"In the rain, he chose to stay dry.","rc.d3.b":"In the rain, he chose the front of the line.","rc.s01.a":"At the hospital, he asked what papers he needed.","rc.s01.b":"At the hospital, he kept the notice for later.","rc.col":"Once, the cold took him down, and he woke at the hospital.","alt.park":"A winter park. A man sits curled at the end of a bench, away from the lamp.","alt.park.n":"The park at night. Lamps are lit; the bench is empty except for one man.","alt.guard":"A guard's flashlight falls on a man lying on the bench.","alt.rain":"Rain falls over the city in grey lines.","alt.kitchen":"A free meal center. A volunteer holds a ladle behind the counter. A bowl of soup is steaming.","alt.kitchen.seat":"The meal center after lunch. A man sits at a side table with a flyer and a pen.","alt.house":"A room at Sunshine House. A director stands with a small boy. A man stands a little apart. Through the window, two swings, one of them blue.","alt.house.out":"The gate of Sunshine House. A yard with two swings, one of them blue.","alt.L3":"A tiled public restroom. A man stands at a sink under a bare bulb.","alt.L4":"An underpass lit by green-white tubes. People sleep on cardboard along the wall.","alt.L6":"A hospital waiting room. A green cross glows above the door.","alt.L7":"A city square with a stopped fountain and a red donation box.","alt.L8":"A corner store glowing behind glass at night.","alt.L10":"A scrapyard with wire bales and a scale.","alt.op1":"A small apartment window facing the morning. A woman's silhouette at the stove.","alt.op2":"The same window in winter. An empty chair by the stove.","alt.op3":"A wet road at night. Headlights in the rain.","alt.op4":"A table covered with envelopes.","alt.op5":"A man and a small child at the gate of Sunshine House.","alt.end":"A dark screen with a single window of light.","alt.drawing":"A pencil drawing of a small round face.","tr.hun.up":"The shaking in his hands eases.","tr.hun.down":"His legs feel the cold path first.","tr.hp.up":"The ache loosens its grip.","tr.hp.down":"The cold settles into his joints.","tr.se.up":"His back straightens a little.","tr.se.down":"His eyes stay on the ground a little longer.","tr.ho.up":"The light seems a little warmer.","tr.ho.down":"The colours seem farther away.","tr.money.up":"The coin pocket is heavier.","tr.money.down":"The coin pocket is lighter.","tr.face":"Someone in the city has a face now.","tr.name":"Today, for the first time, someone called him by his name.","tr.panic":"His breath comes short. The world narrows to the next step."}}</script>

이에게 하고 싶은 말","q.hint":"10글자 이내. 이 기기에만 남고, 설정에서 언제든 지울 수 있습니다.","q.skip":"건너뛰기","q.go":"시작","q.made":"Homeless Survivor는 다양한 환경의 사용자를 고려하여 설계되었으며, 원클릭만으로 실행됩니다. 프로그램은 별도의 설치가 필요 없는 단일 HTML 파일로 구성되어 있으며, 그래픽은 웹 표준인 SVG(Scalable Vector Graphics)를 사용해 구현되었습니다. SVG는 XML 기반의 2차원 벡터 그래픽 기술로, 해상도에 관계없이 선명한 화면을 유지하면서도 용량이 작습니다.","lt.ask":"사랑하는 자식에게 편지를 보내겠습니까?","lt.yes":"편지를 보낸다","lt.no":"지금은 아니다","lt.h":"소리 편지","lt.body":"편지는 이 기기의 스피커에서 짧은 멜로디가 됩니다. 가까이 있는 휴대폰이 그 소리를 들을 수 있습니다. 어떤 네트워크로도 보내지 않으며, 아무것도 녹음하지 않습니다.","lt.yours":"보낼 편지","lt.pick":"소리 편지는 영어 대문자만 실을 수 있습니다. 하나를 고르세요:","lt.send":"편지 보내기","lt.playing":"멜로디가 흐르는 중…","lt.sent":"편지가 공기 속으로 보내졌습니다.","lt.nosound":"이 브라우저에서는 소리를 낼 수 없습니다. 편지는 수첩에 남습니다.","decl.top":"2D 텍스트 인터랙티브 시네마","decl.body":"이 작품은 SVG 실루엣과 정제된 텍스트, 그리고 시스템 규칙(스탯과 선택지 터널링) 자체를 영화적 연출 도구로 사용합니다.","cred.1":"Morgan J. 제공","cred.2":"감독 Morgan J.","cred.3":"시나리오·연출 Morgan J.","cred.4":"© 2026 Morgan J. 모든 권리 보유.","op.1":"아침을 향한 창이 있는 작은 집이 있었다. {hero}는 물류 창고에서 지게차를 몰았다. 아내는 요리를 하며 노래를 불렀다.","op.2":"그러다 아내가 병을 얻었다. 노래는 겨울이 끝나기 전에 멈췄다. {son}은 엄마의 목소리를 기억하기에는 너무 어렸다.","op.3":"어느 밤, 긴 근무를 마친 뒤였다. 비가 내렸고, 멈추지 않은 차가 있었다. {hero}는 무릎 아래가 없는 채로 병원에서 눈을 떴다.","op.4":"치료보다 청구서가 더 빨리 왔다. 그는 일을 잃었고, 그다음에는 집을 잃었다.","op.5":"그는 세 살이던 {son}을 '햇살의 집'에 맡겼다. 형편이 나아지면 데리러 오겠다고 약속했다.","op.6":"형편은 나아지지 않았다. 몇 해 동안 그는 좁은 방과 짧은 일 사이를 떠돌았다. 이번 겨울, 그에게 남은 곳은 공원의 벤치 하나뿐이다.","op.6b":"벤치에서 그는 사진을 꺼낸다. 엄지가 닿는 모서리가 부드럽게 닳았다.","draw.btn":"아들의 얼굴을 그린다.","op.6b.r":"전단 뒷면에 연필 선 몇 개. 작은 얼굴, 거의 웃는 얼굴.","op.7":"이번 주에 아들의 생일이 온다.","op.skip":"이야기 건너뛰기","tc.note":"첫 여정은 보통 난이도로 진행됩니다. 30일째의 엔딩을 보면 어려움과 극악이 열립니다.","pl.L1":"공원 벤치","pl.L2":"급식소","pl.L3":"공중화장실","pl.L4":"지하도","pl.L5":"햇살의 집","pl.L6":"병원","pl.L7":"광장","pl.L8":"편의점","pl.L9":"쉼터","pl.L10":"고물상","loc.L1":"아무도 앉지 않은 자리에 서리가 앉았다. 길 위의 가로등이 웅웅거린다.","loc.L1.n":"가로등이 켜져 있다. 벤치는 낮보다 넓어 보인다.","loc.L2":"붉은 벽돌, 김 서린 창, 문이 열리기 전부터 시작되는 줄.","loc.L2.c":"문이 닫혀 있다. 종이 안내문: 점심은 열한 시 반부터.","loc.L3":"락스 냄새가 나는 타일 방. 수도꼭지에서 찬물이, 그다음엔 더 찬물이 나온다.","loc.L4":"형광등, 가장자리를 맞대어 깐 박스, 머리 위로 낮게 울리는 차 소리.","loc.L5":"낮은 대문, 그네 두 개가 있는 마당, 문 옆의 초인종.","loc.L5.c":"대문이 닫혀 있다. 안내문: 면회는 면회일의 오후와 저녁.","loc.L5.done":"바람에 그네가 조금 흔들린다. 오늘의 면회는 끝났다.","loc.L6":"번호표가 있는 대기실, 딱딱 소리를 내는 라디에이터.","loc.L7":"비둘기, 겨울이라 멈춘 분수, 그리고 빨간 기부함.","loc.L8":"유리 너머 환한 진열대. 문이 열릴 때마다 종이 울린다.","loc.L8.c":"가게에 불은 켜져 있지만, 그를 내쫓지 않는 점원은 저녁에야 온다.","loc.L10":"철사로 묶은 더미, 바늘이 떨리는 저울, 고개를 들지 않는 장갑 낀 남자.","loc.L10.c":"대문에 사슬이 걸려 있다. 고물상은 오전, 오후, 저녁에 물건을 받는다.","hub.lunch":"급식소에서 점심을 배식하고 있다.","hub.visit":"햇살의 집 면회 시간이다.","hub.visit.last":"오늘의 마지막 면회 시간이다.","map.h":"어디로 갈까","map.here":"지금 있는 곳","map.near":"한 걸음","map.mid":"걷는 길","map.far":"먼 길","map.road":"큰길을 건넘","map.locked":"5일부터 열린다","map.noedge":"한 번에 갈 수 없다","map.closed":"지금은 닫힘","map.costN":"포만 −{c}","map.note":"한 번 움직이면 하루의 한 때가 지난다.","map.lunch":"점심에 맞춰 도착","map.visit":"면회에 맞춰 도착","mv.1":"짧은 길. 무릎 틈으로 찬 기운이 들어온다.","mv.2":"길은 거리보다 다리를 더 많이 가져간다.","mv.3":"성한 다리 하나로 먼 길이다. 욱신거림이 가라앉도록 두 번 멈춘다.","mv.road":"큰길 앞에서, 다른 사람들과 함께 신호를 기다린다.","mv.rain":"빗물이 옷깃 안쪽으로 흘러든다.","why.1":"배 속이 먼저 대답한다. 그 생각은 조금 뒤에.","why.2":"빵 냄새가 생각을 밀어낸다. 배를 채우면, 생각도 돌아올 것이다.","why.3":"생각이 거기까지 가다가, 허기에 걸려 넘어진다. 먼저 먹고, 그다음에.","why.4":"그 생각이 보인다. 아직 손이 닿지 않을 뿐이다.","why.5":"나중에. 손이 떨리지 않을 때.","why.6":"아직은.","why.se":"시선이 바닥에 머문다. 그 생각에는 조금 더 펴진 등이 필요하다.","c0101.t":"누군가 벤치 다리를 발로 툭툭 친다. “아저씨, 여기서 자면 안 된다니까.” 경비원의 손전등이 {hero}의 얼굴을 지나 의족 위에서 멈춘다. 불빛이 잠깐 머뭇거린다.","c0101.a":"일어난다.","c0101.a.r":"무릎 아래가 차갑다. 의족을 끼우는 동안 경비원은 등을 돌리고 서 있다. 기다려 주는 건지, 보기 싫은 건지는 모르겠다.","c0101.b":"조금만 더 누워 있는다.","c0101.b.r":"“오 분이요.” 경비원이 한숨을 쉬고 간다. 오 분은 생각보다 짧다.","c0102.t":"옆 벤치의 노인이 신문지를 개며 말한다. “처음이지? 표가 나. 가방을 너무 꼭 안고 있거든.” 노인은 이가 몇 개 없는 입으로 웃는다.","c0102.a":"급식소가 어디냐고 묻는다.","c0102.a.r":"노인이 막대기로 흙바닥에 지도를 그린다. 큰길 건너, 붉은 벽돌 건물. “열한 시 반부터야. 늦으면 국만 남아.” 지도가 열린다.","c0102.b":"혼자 알아보겠다고 한다.","c0102.b.r":"“그래, 그것도 방법이지.” 노인은 다시 신문을 펼친다. 지도 한쪽 귀퉁이가 조금 열린다.","c0103.t":"어제 점심 뒤로 들어간 것이 없다. 빈속이 울리는 소리가 귀에까지 차오를 무렵, 공원 건너편에서 누군가 빵 봉지를 뜯는다.","c0103.p":"서류 가방을 든 남자의 구두 소리가 벤치 앞을 스쳐 간다. 멈출 기색은 없다.","c0103.in":"배가 고프면, 생각이 좁아진다.","c0103.still":"붙잡고 있던 생각들이 하나씩 멀어진다.","c0103.1":"쓰레기통을 본다.","c0103.2":"급식소 쪽으로 걸음을 옮긴다.","c0103.3":"빵을 먹는 사람에게 인사한다.","c0103.4":"오늘 할 일을 수첩에 적는다.","c0103.1.r":"빈 컵 아래 구겨진 신문지뿐, 허기를 채울 만한 것은 보이지 않는다. 그제야 노인이 일러 준 급식소 길이 떠오른다.","c0103.2.r":"차가운 길에서는 한 걸음이 조금씩 더 비싸다. 노인이 일러 준 대로 큰길을 건너는 동안, 발끝부터 식어 간다.","c0103.2.r.u":"차가운 길에서는 한 걸음이 조금씩 더 비싸다. 국 냄새를 따라 큰길을 건너는 동안, 발끝부터 식어 간다.","q.front":"줄 앞쪽이다.","q.mid":"줄은 벌써 모퉁이까지 닿아 있다. 그는 중간에 선다.","q.back":"그가 도착했을 때, 줄은 이미 두 번 꺾여 있다.","c0104.t":"국자를 든 채 배식대 너머의 여자가 묻는다. “처음 오셨죠? 성함이 어떻게 되세요?” 줄 뒤에서 헛기침 소리가 난다. 마지막으로 제 이름을 소리 내어 말한 게 언제였더라.","c0104.a":"“{hero}입니다.”","c0104.a.r":"“{hero} 님, 뜨거우니까 조심하세요.” 국그릇에서 김이 오른다. 이름 뒤에 붙은 ‘님’이라는 글자가 국보다 뜨겁다.","c0104.b":"고개만 숙인다.","c0104.b.r":"여자는 더 묻지 않고 국을 한 국자 더 얹어 준다. 그릇을 받쳐 든 손이 구석 자리를 찾아간다.","ret.t":"국물이 목을 타고 내려가자, 아침에 붙잡지 못했던 생각들이 하나씩 돌아온다. 그 무렵 여자가 전단 한 장을 뒤집어 볼펜과 함께 건넨다.","ret.rest":"고맙다고 말하고 잠시 쉰다.","ret.rest.r":"“별말씀을요.” 웃으며 돌아서는 여자 뒤로, 한동안 숟가락 부딪는 소리만 남는다.","draw.q":"사진은 오래되었다. 그때 {son}은 세 살이었다. 연필이 종이 위에서 기다린다.","draw.d1":"조금 큰 귀를 그린다.","draw.d2":"정수리 머리카락을 그린다.","draw.d3":"볼의 보조개를 그린다.","draw.r0":"아침에는 떠올리지 못했던 얼굴이다. 동그란 얼굴.","draw.r.d1":"귀가 조금 크다. 그리다 보니 손이 먼저 기억해 낸다.","draw.r.d2":"정수리 머리카락이 조금 뻗쳐 있다. 사진 속 그 아이 그대로다.","draw.r.d3":"한쪽 볼에 작은 보조개. 연필 끝이 그 자리에서 잠시 머문다.","draw.fold":"그는 종이를 두 번 접어, 사진 옆에 넣는다.","p01.t":"오늘만 세 번째로 그 구두 소리가 벤치 앞을 지난다. 이번에는 박자가 조금 느려진다.","p01.t7":"광장 건너편에서 오늘만 세 번째로 그 구두 소리가 지난다. 이번에는 박자가 조금 느려진다.","p01.a":"“안녕하세요.”","p01.b":"땅을 내려다본다.","p01.ok":"구두 소리가 멈추고, “안녕하세요.” 하는 목소리가 내려온다. 고개를 들자 처음으로 그의 얼굴이 보인다.","p01.no":"구두 소리는 멈추지 않고 멀어진다. 얼굴이 있어야 할 자리에는 그림자만 남는다.","c0105.t":"가로등이 하나씩 켜진다. 벤치는 낮보다 넓어 보이고, 바람은 낮보다 날카롭다. 지하도 쪽에서 누군가 박스를 끄는 소리가 난다.","c0105.a":"벤치에 눕는다.","c0105.a.r":"별이 몇 개 보인다. 셀 수 있을 만큼만.","c0105.b":"지하도로 간다.","c0105.b.r":"형광등 아래, 사람들이 박스를 한 장씩 비켜 준다. 아무도 말하지 않지만 자리가 생긴다.","night2.t":"가로등이 켜진다. 오늘 밤의 추위는 날이 다르다. 모래처럼 가늘다.","night.note":"잠들기 전, 수첩을 편다. 첫 장에 적힌 말: “{note}”","night.note0":"잠들기 전, 수첩을 편다. 첫 장은 아직 비어 있다.","night.bed":"벽 옆에 마르고 두툼한 깨끗한 박스 한 장이 놓여 있다.","act.lunch":"급식 줄에 선다.","act.rest":"잠시 앉아 쉰다.","act.rest.L1":"벤치에 등을 기대고 쉰다.","act.rest.r":"의족이 닿는 자리의 욱신거림이 잠시 가라앉는다.","act.scrap":"캔과 박스를 줍는다.","act.scrap.r":"캔 두 개, 납작한 박스 하나. 허리를 굽힐 때마다 값을 치른다.","act.scrap.r1":"벤치 밑으로 굴러간 캔 하나. 나머지 쓰레기통은 이미 누군가 훑고 갔다.","act.sell":"모은 것을 판다.","act.sell.r":"저울 바늘이 흔들리다 멈춘다. 손바닥에 동전 몇 개가 떨어진다.","act.wash":"얼굴과 손을 씻는다.","act.wash.r":"찬물, 그리고 거울. 거울 속 사람이 조금 더 오래 눈을 마주한다.","act.help":"탁자 닦는 일을 돕는다.","act.help.r":"여자가 행주를 건넨다. “박이에요. 다들 박 선생이라고 불러요. 고마워요.” 탁자 위에 젖은 줄무늬가 길게 남는다.","act.help.r2":"{N01}이 그의 손에 든 행주를 보고 고개를 끄덕이며 의자를 비켜 준다.","act.warm":"대기실에서 몸을 녹인다.","act.warm.r":"라디에이터가 딱딱 소리를 낸다. 누군가의 번호가 불리고, 다음 번호가 불린다.","act.beg":"손을 내민다.","act.beg.r":"구두들이 지나간다. 몇은 느려지고, 대부분은 그대로다. 동전 몇 개, 그리고 바닥을 오래 보는 시간.","act.beg.known":"내민 손 위에 동전이 놓인다. 고개를 들자, 인사를 나눈 그 얼굴이다. 그는 아무 말 없이 고개를 한 번 끄덕이고 간다.","act.beg.insult":"“일이나 해요.” 고개를 들기 전에 목소리는 멀어진다.","act.bread":"빵 하나를 산다.","act.bread.r":"포장지가 바스락거린다. 문 옆에 선 채로 반을 먹고, 나머지 반도 먹는다.","act.clean":"청소부를 도와 쓰레기를 줍는다.","act.clean.ok":"청소부가 그를 위해 봉투를 벌려 든다. 봉투가 차자, 그녀가 그를 똑바로 본다. 주름지고 또렷한 얼굴이다.","act.clean.no":"청소부는 말없이 봉투를 받아 들고 다음 쓰레기통으로 간다.","act.bell":"햇살의 집 초인종을 누른다.","bag.eat":"냅킨에 싼 빵을 먹는다.","bag.eat.r":"이제 식고 조금 납작해졌다. 주머니 맛과 점심 맛이 난다.","x0201.t":"초록 조끼를 입은 여자가 벤치 옆에 무릎을 꿇는다. “새벽길 센터에서 왔어요. 머물 곳과 일자리를 찾도록 돕고 있어요.” 여자가 명함을 건넨다. 그리고 조금 더 조용히 덧붙인다. “햇살의 집 원장님이 이걸 전해 달라고 하셨어요.” 편지다. 한 가정이 {son}을 입양하고 싶다고 했다. 원장은 아버지의 생각을 알고 싶어 한다.","x0201.t4":"지하도 입구, 초록 조끼를 입은 여자가 그의 박스 옆에 무릎을 꿇는다. “새벽길 센터에서 왔어요. 머물 곳과 일자리를 찾도록 돕고 있어요.” 여자가 명함을 건넨다. 그리고 조금 더 조용히 덧붙인다. “햇살의 집 원장님이 이걸 전해 달라고 하셨어요.” 편지다. 한 가정이 {son}을 입양하고 싶다고 했다. 원장은 아버지의 생각을 알고 싶어 한다.","x0201.a":"오늘 햇살의 집에 간다.","x0201.b":"아이를 위해, 혼자 센터로 간다.","x0201.c":"동의서에 서명한다.","x0201.a.r":"“면회는 오후랑 저녁이에요.” 여자가 명함 뒷면에 적는다. “문 옆에 세면대가 있어요. 먼저 씻으셔도 돼요.”","x0201.bd":"아들의 생일까지 닷새.","cf.end":"이 선택은 이야기를 이틀째에 여기서 끝냅니다. 그를 사랑하는 한 가지 방식이며, 이야기는 이 선택을 판단하지 않습니다.","cf.think":"다시 생각한다","cf.b":"센터로 간다","cf.c":"서명한다","e0a.1":"센터의 승합차에서는 커피와 젖은 외투 냄새가 난다. 아무도 그에게 말을 시키지 않는다.","e0a.2":"첫 달, 그는 공동 숙소에서 잠을 자고, 두려움 없이 깨어나는 법을 다시 배운다.","e0a.3":"석 달째, 그는 새 의족으로 다시 지게차를 몬다. 천천히.","e0a.4":"일요일마다 그는 햇살의 집 앞을 지난다. 안으로 들어가지는 않는다. 창 안에서 한 아이가 그림을 그리고 있다.","e0a.5":"그는 부치지 않는 편지를 쓴다. 첫 줄은 언제나 같다. “{note}”","e0a.5n":"그는 부치지 않는 편지를 쓴다.","e0a.h":"조기 엔딩 — 조용한 약속","e0a.l":"그는 안전하다. 그는 일한다. 그리고 두 사람 사이에는 아직 창문 하나가 있다.","e0b.1":"그는 자기 이름처럼 보이도록 천천히 서명한다.","e0b.2":"센터는 그가 방을 구하도록 돕고, 일을 구하도록 돕고, 그 방을 지킬 이유를 찾도록 돕는다.","e0b.3":"봄에 원장이 사진 한 장을 보낸다. {son}이 두 사람 사이에 서서 공룡 인형을 안고 있다.","e0b.4":"사진 뒷면에 아이의 글씨가 있다. “여기가 내 새 집이에요.”","e0b.5":"{hero}는 작은 탁자 위에 사진을 붙인다. 아침마다 그는 언젠가 하고 싶었던 말을 한다. “{note}”","e0b.5n":"{hero}는 작은 탁자 위에 사진을 붙인다.","e0b.h":"조기 엔딩 — 새 가족의 집","e0b.l":"그는 다른 방식으로 약속을 지켰다.","e0.other":"다른 길, 오늘 햇살의 집으로 가는 길은 새 이야기에 그대로 있습니다.","c0202.who.k":"배식대의 {N01}이 줄 속의 그를 알아보고 국자를 조금 든다.","c0202.who.u":"배식대의 여자가 줄 속의 그를 알아보고 국자를 조금 든다.","c0202.say.n":"“{hero} 님, 또 오셨네요.”","c0202.say.u":"“또 오셨네요.”","c0202.t2":"그녀의 눈이 그의 주머니에서 삐져나온 새벽길 센터 명함에 잠시 머문다.","c0202.a":"햇살의 집 가는 길을 묻는다.","c0202.a.r":"그녀가 냅킨에 길을 그린다. 병원 쪽은 멀고, 광장 쪽이 가깝다. “세면대부터 쓰세요. 아이들은 손을 봐요.”","c0202.b":"빵 한 조각을 챙겨 둔다.","c0202.b.r":"빵을 냅킨에 싸서 주머니에 넣는다. 한동안 주머니가 따뜻하다.","m01.ent":"“여기서 손 씻으시면 돼요.” 원장이 가리키는 세면대 앞에서 외투를 한쪽 팔에 걸치는데, 안쪽 문 옆의 작은 신발 한 켤레가 먼저 눈에 들어온다.","m01.wash":"물이 따뜻하다. 손가락 마디 주름에 낀 잿빛을 문질러 낸다.","m01.dir":"문 옆에서 원장이 조용히 말한다. “그 가족 이야기는 기다려도 돼요. 아버님 없이 정하지 않을 거예요.”","m01.meet":"“엄마와 아빠를 알던 분이야.” 원장의 말에도 {son}은 원장 곁에 붙어 선다. “아저씨 누구세요?” 아이 머리에 닿기 전에, 손이 먼저 내려간다.","m01.det.d1":"귀가 조금 크다. 그대로다.","m01.det.d2":"정수리의 머리카락이 아직도 뻗쳐 있다.","m01.det.d3":"말할 때 한쪽 볼에 보조개가 팬다.","m01.det.0":"사진 속 얼굴을 찾는다. 천천히, 한 군데씩.","m01.a":"그네 이야기를 묻는다.","m01.b":"앉을 자리를 맡긴다.","m01.a.r":"“어느 그네가 좋아?” 창밖을 향한 손가락이 망설임 없이 하나를 고른다. “파란 거요. 다른 건 소리가 나요.” 아이가 바깥을 보는 동안, 그 곁에 말없이 선다.","m01.b.r":"{son}이 의자 하나를 문에서 조금 떼어 놓는다. “거기 앉으세요.” 그 의자에 앉자, 잠시 서 있던 아이가 옆 의자를 끌어온다.","m01.out":"문 앞에서 {son}이 돌아본다. “작은 공룡 열쇠고리를 봤어요.” 아이가 손가락 두 개로 크기를 보여 준다. 원장은 아이의 말이 끝날 때까지 기다린다.","m01.snack":"나가는 길에 원장이 크래커 한 봉지를 손에 쥐여 준다. “가시는 길에 드세요.”","m01.miss":"도시 저편, 햇살의 집 창의 불이 하나씩 꺼진다.","mina.t":"계산대 뒤의 젊은 점원이 삼각김밥 날짜를 확인한다. 세 개를 따로 밀어 두고, 그를 본다. “자정에 기한 지나요. 어차피 버리는 거예요.”","mina.a":"고맙다며 받는다.","mina.b":"하나만 받고 둔다.","mina.a.r":"“전 미나예요.” 영수증의 한 줄처럼 덧붙인다.","mina.b.r":"점원이 눈썹을 올리더니 나머지 둘을 계산대 아래로 넣는다. “내일도 여기 있을 거예요.”","d3.slug":"3일 · 비","d3.t1":"날이 밝기 전에 비가 온다. 벤치 틈과 옷깃 틈을 정확히 찾아 들어온다.","d3.t4":"날이 밝기 전에 비가 온다. 지하도 입구에서는 곧은 잿빛 커튼처럼 떨어진다.","d3.a":"지하도에서 비를 피한다.","d3.a.s":"몸은 마른다. 급식 줄에는 늦는다.","d3.b":"급식소 줄에 일찍 선다.","d3.b.s":"젖는다. 줄 앞쪽에 선다.","d3.m.a":"빗줄기가 가늘어질 때까지 형광등 아래에서 기다린다. 급식소에 닿았을 때, 줄은 길다.","d3.m.b":"맨 앞 열 명과 함께 빗속에 선다. 문이 열리자, 외투마다 김이 오른다.","lunch.front":"가득 찬 국그릇. 아직 들고 있기 뜨겁다.","lunch.mid":"가득 찬 국그릇. 빵은 그의 두 사람 뒤에서 떨어진다.","lunch.back":"배식대에 닿았을 때는 국만 남아 있다.","d3.p01":"우산 아래에서 서류 가방의 남자가 지나가며 고개를 한 번 끄덕인다. 얼굴은 그대로 있다.","d3.hosp":"오후, 비에 밀려 병원 대기실로 들어선다. 간호사가 그의 번호표를 부른다.","s01.t":"{N05}가 진료 침대 옆에 서류를 놓는다. “상담 신청서예요. 오늘 새 의족을 약속하는 건 아니에요.” {hero}는 볼펜을 들기 전에 첫 줄을 확인한다.","s01.a":"필요한 서류를 묻는다.","s01.a.r":"“급식소 확인서부터 가져오세요.” {N05}가 병원 운영 시간을 적는다. {hero}는 젖지 않을 곳에 안내문을 넣는다.","s01.b":"안내문만 챙겨 둔다.","s01.b.r":"안내문을 접어 마른 주머니에 넣는다. 센터 명함 옆이다.","d3.night":"지하도는 밤새 웅웅거린다. 새벽녘, 지게차 꿈을 꾼다. 포크가 올라가고, 팔레트가 흔들리지 않고, 손이 모든 자리를 안다.","omen":"하늘이 한 톤 무겁다. 광장 쪽에 낯선 사람들이 서성인다.","lk.pick":"광장 근처에서 누군가 그를 스치고 지나간다. 급식소 앞에 와서야, 동전 주머니가 가벼워진 것을 안다.","lk.pick.g":"“가방 조심하세요.” 아는 목소리가 걸음을 멈추지 않고 말한다. 그는 끈을 바짝 당긴다. 잠시 뒤, 누군가 그를 스치고 지나가지만 아무것도 얻지 못한다.","lk.fall":"젖은 계단에서 목발이 미끄러진다. 손바닥이 대가를 치른다.","lk.fall.g":"젖은 계단에서, 목발이 미끄러지기 전에 아는 손이 그의 팔꿈치를 잡는다.","lk.short":"오늘은 국이 묽다. 국자가 솥 바닥을 긁는다.","lk.short.g":"오늘은 국이 묽지만, 국자가 그를 위해 한 번 더 솥으로 들어간다.","lk.crack":"경관 두 명이 벤치를 비운다. 모두가 한꺼번에 움직이고, 아무도 어디로 가냐고 묻지 않는다.","lk.crack.g":"경관 두 명이 벤치를 비운다. 청소부가 그중 한 명에게 무언가 말하자, 그가 짐을 천천히 챙기도록 둔다.","lk.coin":"연석 옆에 동전 하나, 앞면이 위다.","lk.coffee":"줄에 선 누군가가 종이컵 커피를 건네고, 고맙다는 말을 기다리지 않는다.","lk.bread":"빵집 뒷문이 열린다. 어제의 빵이 쓰레기통 대신 그의 손으로 온다.","lk.none":"하루가 그에게 아무것도 묻지 않고 지나간다.","col.t":"추위가 생각이 일어나는 자리까지 닿고, 그다음엔 아무것도 없다.","col.r":"하얀 천장 아래에서 눈을 뜬다. 누군가 젖은 신발을 벗겨 두었다. “길가에서 쓰러지셨어요.” 간호사가 말한다. “쉬시고, 뭐라도 드세요.”","col.r2":"다시 하얀 천장. 같은 간호사, 같은 담요. 이번에는 그녀가 묻지 않고 차트에 그의 이름을 적는다.","col.note":"본편에서는 쓰러짐이 이야기를 끝낼 수 있습니다. 이 샘플에서는 언제나 병원에서 깨어납니다.","bag.photo":"모서리가 부드럽게 닳은 {son}의 사진.","bag.draw":"두 번 접은 전단 뒷면의 그림.","bag.card":"새벽길 센터 명함. 뒷면에 면회 시간.","bag.notice":"젖지 않게 챙긴 병원 안내문.","bag.breadI":"냅킨에 싼 빵 한 조각.","bag.scrap":"캔과 납작한 박스: {n}","bag.note":"수첩 첫 장: “{note}”","bag.note0":"수첩 첫 장: 비어 있음.","bag.faces":"빛을 되찾은 얼굴: {n}","end.h":"홈리스 서바이버의 첫 사흘이었습니다.","end.next":"본편에서는 같은 하늘 아래 4일째가 시작됩니다. {son}의 생일은 나흘 뒤입니다.","end.rules":"허기가 선택지를 좁힌다. 희망이 세계에 색을 돌려준다. 인사받은 낯선 사람에게 얼굴이 생긴다.","end.other":"다른 선택은 다른 하루를 엽니다.","end.again":"다시 플레이","end.title":"타이틀로","end.note":"수첩 첫 장에 적힌 말: “{note}”","rc.c0101.a":"불빛이 닿자 그는 일어났다.","rc.c0101.b":"그는 오 분을 더 청했다.","rc.c0105.a":"첫날 밤, 그는 별 몇 개 아래 벤치에서 잤다.","rc.c0105.b":"첫날 밤, 그는 지하도로 갔고, 자리가 생겼다.","rc.mina":"편의점에서, 한 점원이 그의 몫을 따로 밀어 두었다.","rc.trash":"허기 속에서 그는 먼저 쓰레기통을 보았다.","rc.walk":"허기 속에서 그는 곧장 급식소로 걸었다.","rc.name":"그는 자기 이름을 소리 내어 말했다.","rc.head":"그는 고개를 숙였고, 국을 조금 더 받았다.","rc.d1":"그는 귀가 큰 동그란 얼굴을 그렸다.","rc.d2":"그는 정수리 머리카락이 뻗친 동그란 얼굴을 그렸다.","rc.d3":"그는 보조개가 있는 동그란 얼굴을 그렸다.","rc.rest":"그는 쉬면서 숟가락 소리를 들었다.","rc.greet":"그가 인사했고, 낯선 사람에게 얼굴이 생겼다.","rc.greet.no":"그가 인사했지만, 그 남자는 그림자로 지나갔다.","rc.down":"그는 땅을 보았고, 그 남자는 그림자로 남았다.","rc.miss":"서류 가방의 남자는 그가 없는 곳을 지나갔다.","rc.swing":"그는 {son}에게 그네 이야기를 물었다.","rc.seat":"그는 앉을 자리를 {son}에게 맡겼다.","rc.novisit":"편지를 받은 날, 그는 햇살의 집에 닿지 못했다.","rc.d3.a":"빗속에서 그는 몸을 말리는 쪽을 골랐다.","rc.d3.b":"빗속에서 그는 줄 앞쪽을 골랐다.","rc.s01.a":"병원에서 그는 필요한 서류를 물었다.","rc.s01.b":"병원에서 그는 안내문을 챙겨 두었다.","rc.col":"한 번, 추위가 그를 쓰러뜨렸고, 그는 병원에서 깨어났다.","alt.park":"겨울 공원. 가로등 빛이 닿지 않는 벤치 끝에 한 남자가 웅크려 앉아 있다.","alt.park.n":"밤의 공원. 가로등이 켜져 있고, 벤치에는 한 남자뿐이다.","alt.guard":"경비원의 손전등 빛이 벤치에 누운 남자 위에 떨어진다.","alt.rain":"잿빛 줄을 그으며 도시 위로 비가 내린다.","alt.kitchen":"무료 급식소. 봉사자가 배식대 뒤에서 국자를 들고 있다. 국그릇에서 김이 오른다.","alt.kitchen.seat":"점심이 끝난 급식소. 한 남자가 구석 탁자에 전단과 볼펜을 두고 앉아 있다.","alt.house":"햇살의 집의 방. 원장 곁에 작은 남자아이가 서 있다. 한 남자가 조금 떨어져 서 있다. 창밖에 그네 두 개, 그중 하나는 파란색이다.","alt.house.out":"햇살의 집 대문. 그네 두 개가 있는 마당, 그중 하나는 파란색이다.","alt.L3":"타일로 된 공중화장실. 한 남자가 전구 아래 세면대 앞에 서 있다.","alt.L4":"녹백색 형광등이 비추는 지하도. 벽을 따라 사람들이 박스 위에 누워 있다.","alt.L6":"병원 대기실. 문 위에 초록 십자가가 빛난다.","alt.L7":"멈춘 분수와 빨간 기부함이 있는 도시 광장.","alt.L8":"밤, 유리 너머로 빛나는 편의점.","alt.L10":"철사로 묶은 더미와 저울이 있는 고물상.","alt.op1":"아침을 향한 작은 집의 창. 가스레인지 앞 여자의 실루엣.","alt.op2":"겨울의 같은 창. 가스레인지 옆의 빈 의자.","alt.op3":"밤의 젖은 도로. 빗속의 전조등.","alt.op4":"봉투로 덮인 탁자.","alt.op5":"햇살의 집 대문 앞의 남자와 작은 아이.","alt.end":"빛나는 창 하나가 있는 어두운 화면.","alt.drawing":"작고 동그란 얼굴의 연필 그림.","tr.hun.up":"손끝의 떨림이 조금 줄었다.","tr.hun.down":"다리가 차가운 길을 먼저 느낀다.","tr.hp.up":"욱신거림이 조금 풀린다.","tr.hp.down":"추위가 관절에 자리 잡는다.","tr.se.up":"등이 조금 펴진다.","tr.se.down":"시선이 바닥에 조금 더 오래 머문다.","tr.ho.up":"빛이 조금 따뜻해 보인다.","tr.ho.down":"색이 조금 멀어진다.","tr.money.up":"동전 주머니가 묵직해졌다.","tr.money.down":"동전 주머니가 가볍다.","tr.face":"도시의 누군가에게 얼굴이 생겼다.","tr.name":"오늘 처음으로 누군가가 이름을 불러 주었다.","tr.panic":"숨이 짧아진다. 세상이 다음 한 걸음만큼 좁아진다."}}</script>

      el('h2', null, T('lt.h'), f);
      el('p', 'made', T('lt.body'), f);
      var up = words.toUpperCase(), chosen = LETTER.ok(up) ? up : (at.pick || PREPARED[0]);
      if (LETTER.ok(up)) { el('p', 'hint', T('lt.yours'), f); el('p', 'letter', up, f); }
      else {
        el('p', 'hint', T('lt.pick'), f);
        var g = el('div', 'hs-radios', null, f); g.setAttribute('role', 'radiogroup');
        PREPARED.forEach(function (t, i) {
          var lab = el('label', null, null, g), r = el('input', null, null, lab); r.type = 'radio'; r.name = 'hs-letter'; r.value = t; r.checked = t === chosen;
          r.addEventListener('change', function () { chosen = t; st.at.pick = t; save(); });
          el('span', null, t, lab);
          if (i === 0) { r.setAttribute('data-first', '1'); }
        });
      }
      var status = el('p', 'hint', '', f); status.setAttribute('aria-live', 'polite');
      var row = el('div', 'hs-askrow', null, f);
      var pb = btn('hs-btn eq', T('lt.send'), function () {
        pb.disabled = true; status.textContent = T('lt.playing');
        playLetter(chosen, function (ok) { pb.disabled = false; status.textContent = T(ok ? 'lt.sent' : 'lt.nosound'); });
      }, row);
      btn('hs-btn eq pri', T('ui.next') + ' ▸', function () { show({ n: 'decl' }); }, row);
    }
  };
  N.decl = {
    build: function () {
      var f = fullScreen('hs-decl');
      el('p', 'top', T('decl.top'), f);
      el('p', 'body', T('decl.body'), f);
      var b = btn('hs-next', T('ui.next') + ' ▸', function () { show({ n: 'cred' }); }, el('div', 'hs-nextrow center', null, f)); b.setAttribute('data-next', '1');
    }
  };
  N.cred = {
    build: function () {
      var f = fullScreen('hs-cred');
      var lines = ['cred.1', 'cred.2', 'cred.3', 'cred.4'].map(function (k, i) { var p = el('p', i === 3 ? 'c small' : 'c', T(k), f); if (!still()) { p.classList.add('wait'); later(300 + i * 800, function () { p.classList.remove('wait'); }); } return p; });
      var b = btn('hs-next', T('ui.next') + ' ▸', function () { show({ n: 'op', i: '1' }); }, el('div', 'hs-nextrow center', null, f)); b.setAttribute('data-next', '1');
    }
  };
  N.tc = {
    build: function () {
      var f = fullScreen('hs-tc');
      el('h1', null, T('ui.title'), f);
      el('p', 'tag', T('ui.tag'), f);
      el('p', 'by', T('ui.by'), f);
      el('p', 'note', T('tc.note'), f);
      el('p', 'dep', T('ui.dep'), f);
      f.setAttribute('tabindex', '-1'); f.setAttribute('data-first', '1');
      var go = function () { if (st.at.n === 'tc') { beginDay1(); } };
      f.addEventListener('click', go);
      later(7000, go);                                                       /* the title card has no button (260.1 #6): it holds, then opens day 1 */
    }
  };
  function beginDay1() { st.day = 1; st.ph = 1; st.loc = 'L1'; drawLuck(); show({ n: 'c0101' }); }
  function credits(f) { ['cred.2', 'cred.3', 'cred.4'].forEach(function (k) { el('p', 'c small', T(k), f); }); }
  N.e0end = {
    build: function (at) {
      sdel(KEY.game);
      var f = fullScreen('hs-endcard');
      el('h1', null, T('e0' + at.w + '.h'), f);
      el('p', 'line', T('e0' + at.w + '.l'), f);
      el('p', 'other', T('e0.other'), f);
      credits(f);
      var row = el('div', 'hs-askrow', null, f);
      var tb = btn('hs-btn eq', T('end.title'), showTitle, row); tb.setAttribute('data-first', '1');
      btn('hs-btn eq pri', T('ui.new'), startStory, row);
    }
  };
  N.end = {
    build: function () {
      sdel(KEY.game);
      root.setAttribute('data-mode', 'full'); topBar(false);
      var stage = el('div', 'hs-stage', null, root), svg = endScene(); stage.appendChild(svg); applyHope(svg, true);
      var f = el('div', 'hs-full hs-endcard', null, root);
      el('h1', null, T('end.h'), f);
      var ul = el('ul', 'recap', null, f);
      st.rc.forEach(function (k) { el('li', null, T(k), ul); });
      if (words) { el('p', 'quote', T('end.note'), f); }
      el('p', 'line', T('end.next'), f);
      el('p', 'rules', T('end.rules'), f);
      el('p', 'other', T('end.other'), f);
      credits(f);
      var row = el('div', 'hs-askrow', null, f);
      var tb = btn('hs-btn eq', T('end.title'), showTitle, row);
      var pb = btn('hs-btn eq pri', T('end.again'), startStory, row); pb.setAttribute('data-first', '1');
    }
  };

  /* ===== 14. self-copy download (259): the same file, assembled from what is on this page; nothing is fetched ===== */
  function downloadSelf(noteEl) {
    try {
      var styleEl = Array.prototype.slice.call(document.querySelectorAll('style')).filter(function (n) { return n.textContent.indexOf('.hss{--hs-bg') >= 0; })[0], parts = [];
      parts.push('<!doctype html>\n<!--\n  Homeless Survivor\n  "The more abundance fills everything, the more clearly we come face to face\n   with the loneliness and lack within us."\n  (c) 2026 Morgan J. Story, characters and artwork: all rights reserved.\n  Source code: Apache License 2.0.\n-->\n');
      parts.push('<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Homeless Survivor</title>\n<style>html,body{margin:0;background:#0b0b0b}</style>\n</head>\n<body>\n');
      if (styleEl) { parts.push(styleEl.outerHTML + '\n'); }
      Array.prototype.slice.call(document.querySelectorAll('script[type="application/json"][data-hs-pack="sample-lang"]')).forEach(function (n) { parts.push(n.outerHTML + '\n'); });
      parts.push('<section class="hss" id="hss" aria-label="Homeless Survivor"></section>\n');
      parts.push('<scr' + 'ipt>' + SELF + '</scr' + 'ipt>\n</body>\n</html>\n');
      var blob = new Blob(parts, { type: 'text/html' }), url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = 'Homeless Survivor.html'; a.style.display = 'none';
      root.appendChild(a); a.click(); root.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      if (noteEl) { noteEl.textContent = T('ui.dl.done'); }
    } catch (e) { if (noteEl) { noteEl.textContent = String(e && e.message || e); } }
  }

  /* ===== 15. input map (284): one listener, scoped to this game ===== */
  function inGame(t) { return t === document.body || t === document.documentElement || (t && root.contains(t)); }
  document.addEventListener('keydown', function (e) {
    if (!document.contains(root)) { return; }
    if (e.isComposing || e.keyCode === 229) { return; }                  /* IME guard */
    if (e.ctrlKey || e.metaKey || e.altKey) { return; }
    var t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (!inGame(t)) { return; }
    if (e.key === 'Tab') { kbd = true; if (modal) { trap(e); } return; }
    if (typing) { return; }
    if (e.repeat) { return; }                                              /* holding a key never chooses twice */
    kbd = true;
    var k = e.key;
    if (k === 'Escape') { e.preventDefault(); if (modal) { closeModal(); } else if (st && st.at && root.getAttribute('data-mode') === 'play') { openModal('menu', document.activeElement); } return; }
    if (modal) { return; }
    if (st && st.at && st.at.n === 'tc') { e.preventDefault(); beginDay1(); return; }
    var isBtn = t && t.tagName === 'BUTTON';
    if ((k === 'Enter' || k === ' ') && !isBtn) {
      var nb = root.querySelector('.hs-next'); if (nb) { e.preventDefault(); nb.click(); } return;
    }
    if (/^[1-5]$/.test(k)) {
      var chs = root.querySelectorAll('.hs-choices .hs-ch'), c = chs[+k - 1];
      if (c) { e.preventDefault(); c.focus({ preventScroll: true }); c.click(); }
      return;
    }
    var play = root.getAttribute('data-mode') === 'play' && st && st.at;
    if (!play) { return; }
    var lk = k.toLowerCase();
    if (lk === 'm' && st.at.n === 'hub' && st.mapLevel) { e.preventDefault(); openModal('map', document.activeElement); }
    if (lk === 'i') { e.preventDefault(); openModal('bag', document.activeElement); }
    if (lk === 'l') { e.preventDefault(); openModal('log', document.activeElement); }
  });
  root.addEventListener('pointerdown', function () { kbd = false; });
  function trap(e) {
    var f = modal.querySelectorAll('button:not([disabled]), input, [tabindex="0"]');
    if (!f.length) { return; }
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  onMq(mqReduce, function () { if (st && st.at) { render(); } else { setMotion(); } });

  /* ===== 16. boot ===== */
  showTitle();
})();
</script>
